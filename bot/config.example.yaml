# Articles surveillés et prix de revente. Modifiable dans le Bloc-notes (bouton « Mes niches & prix »),
# pris en compte sans redémarrer.
#
# ref_price = prix auquel l'article SE VEND réellement sur Vinted (par pièce pour un lot).
#   Valeurs issues de la recherche d'octobre 2026, volontairement prudentes (bas de fourchette) :
#   les blogs de revente annoncent souvent 1,5 à 3 fois plus que les ventes réelles.
#   Remplacez-les par la médiane de VOS ventes dès que possible.
# max_buy  = prix Leboncoin maximum pour viser au moins x2,5.
# Mots-clés : sans accents ni majuscules. all = tous requis ([a, b] = a ou b), any = au moins un, none = aucun.
# eBay (facultatif) : search = requête eBay (sinon déduite de all + premier any), variants = requêtes en plus
#   pour les fautes de frappe courantes (annonces moins vues, donc moins chères). Chaque requête coûte du quota.
# Règle d'or : jamais une marque seule, toujours un modèle précis (une marque seule se vend 20-30 €).

config_version: 7     # mis à jour automatiquement par le logiciel (vos prix et réglages sont conservés)

min_ratio: 2.2        # multiplicateur minimum, frais d'achat et port INCLUS (≈ x2,5 sur le prix affiché)
min_profit: 10        # bénéfice net minimum en euros (après cotisations, impôt, emballage)
hand_delivery: false  # false = on compte les frais d'achat sécurisé + port Leboncoin (prudent)
etat_minimum: tres_bon  # neuf | tres_bon | bon | tous : annonces signalant un défaut écartées, et vérifié par l'IA

costs:
  buy_fee_fixed: 0.70
  buy_fee_rate: 0.05
  buy_shipping: 3.50
  packaging: 0.50
  resale_discount: 1.0    # ref_price est déjà un prix de vente réaliste
  tax_rate: 0.134         # micro-entreprise : URSSAF 12,3 % + 0,1 % + versement libératoire 1 %

# Mots qui excluent une annonce, quelle que soit la règle (contrefaçons, recherches, échanges).
exclude: [everdrive, r4, linker, multi jeux, famiclone, bootleg, replica, replique, copie, contrefacon, imitation, inspire, "style carhartt", "type carhartt",
          facon, recherche, cherche, echange, "pour pieces", "hors service", "ne fonctionne pas", proxy,
          hs, "ne s allume pas", "en panne", "a reparer", defectueux, repro, reproduction, fake, "non officiel", compatible]

